# 宿主机 nginx 示例
# - 根路径 / 提供简单首页（site/index.html）
# - /blog/ 反代到 Docker 容器 7777

server {
    listen 80;
    server_name xxx.com;   # 改成你的域名

    # 把这里改成服务器上 site 目录的实际路径
    root /opt/blog/site;
    index index.html;

    # 域名首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /blog → /blog/
    location = /blog {
        return 301 /blog/;
    }

    # 博客反代到 Docker
    location /blog/ {
        proxy_pass http://127.0.0.1:7777/blog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
